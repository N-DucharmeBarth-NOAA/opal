# Ubuntu policy: use ubuntu-22.04 (jammy) in workflows and the devcontainer.
name: Set up opal environment
description: Restore the R environment defined by renv.lock, including native workarounds
inputs:
  r-version:
    description: R version, or renv to read R.Version from renv.lock
    default: renv
  quarto-version:
    description: Quarto CLI version (keep the devcontainer feature in sync)
    default: '1.8.27'
outputs:
  installed-r-version:
    description: Resolved installed R version
    value: ${{ steps.setup-r.outputs.installed-r-version }}
  cache-hit:
    description: Whether the exact renv cache key was found
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # renv reports these as missing SystemRequirements (fs, curl, gert).
    # The font/image libraries are not in that warning but are needed
    # whenever systemfonts/textshaping/ragg fall back to a source build,
    # which is what happens on R 4.6 until P3M has jammy binaries.
    # Deliberately NOT installed here:
    #   pandoc          - provided by setup-pandoc and quarto; apt would
    #                     install jammy's 2.9 and shadow it
    #   pandoc-citeproc - retired upstream, folded into pandoc at 2.11;
    #                     the warning comes from a stale record in loo
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update -y
        xargs -a .github/scripts/system-deps.txt sudo apt-get install -y --no-install-recommends

    - uses: r-lib/actions/setup-pandoc@v2

    - uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: ${{ inputs.quarto-version }}

    - name: Configure renv
      id: config
      shell: bash
      run: |
        echo "image=$(lsb_release -rs)" >> "$GITHUB_OUTPUT"
        {
          echo "RENV_PATHS_ROOT=$HOME/.local/share/renv"
          echo "RENV_CONFIG_CACHE_SYMLINKS=FALSE"
          # Hand package installation to pak only when explicitly requested.
          # With compResidual handled out of band, either installer can work.
          echo "RENV_CONFIG_PAK_ENABLED=${RENV_CONFIG_PAK_ENABLED:-FALSE}"
          echo "R_KEEP_PKG_SOURCE=yes"
        } >> "$GITHUB_ENV"

    - uses: r-lib/actions/setup-r@v2
      id: setup-r
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true

    # Key on the installed version, not the 'release' label. Include the real
    # runner OS/image so binaries from different Ubuntu releases never mix.
    - name: Cache renv packages
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.local/share/renv
        key: renv-v2-${{ runner.os }}-${{ steps.config.outputs.image }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('renv.lock') }}
        restore-keys: renv-v2-${{ runner.os }}-${{ steps.config.outputs.image }}-${{ steps.setup-r.outputs.installed-r-version }}-

    - name: Restore opal environment
      shell: bash
      run: time Rscript .github/scripts/setup-r-env.R
