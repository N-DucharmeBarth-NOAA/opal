# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-22.04
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-opal-env

      - name: Install rcmdcheck
        run: renv::install("rcmdcheck")
        shell: Rscript {0}

      - name: Install Quarto R package
        run: |
          lock <- renv::lockfile_read("renv.lock")
          if (!is.null(lock$Packages$quarto)) {
            renv::restore(packages = "quarto")
          } else {
            # The quarto R package is not locked; retain the existing tool version.
            renv::install("quarto@1.5.1")
          }
        shell: Rscript {0}

      - name: Install testthat
        run: renv::install(c("testthat"))
        shell: Rscript {0}

      - name: Install opal package
        run: renv::install(".")
        shell: Rscript {0}

      - name: Build site
        env:
          OPAL_DOCS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          mode <- if (Sys.getenv("OPAL_DOCS_BRANCH") %in% c("main", "master")) "release" else "devel"
          pkg <- pkgdown::as_pkgdown(".", override = list(development = list(mode = mode)))
          cat(paste0("OPAL_DOCS_PATH=", pkg$dst_path, "\n"), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          pkgdown::check_pkgdown(pkg)
          pkgdown::build_site_github_pages(pkg, new_process = FALSE, install = FALSE, quiet = FALSE)
        shell: Rscript {0}

      - name: Check internal site links
        run: python3 dev/check-site-links.py "$OPAL_DOCS_PATH"

      - name: Retain rendered documentation
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'dev')
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
