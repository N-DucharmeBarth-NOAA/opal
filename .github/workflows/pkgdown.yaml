# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-22.04
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv
      RENV_CONFIG_CACHE_SYMLINKS: FALSE
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      
      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/renv
          key: renv-v2-ubuntu-22.04-4.5.2-${{ hashFiles('renv.lock') }}
          restore-keys: renv-v2-ubuntu-22.04-4.5.2-

      - name: Restore renv environment
        run: |
          install.packages("renv", repos = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))

          # 1. TMB first, in its own transaction so it lands in the real library
          renv::restore(packages = c("Rcpp", "Matrix", "RcppEigen", "cpp11",
                           "BH", "RcppParallel", "rapidjsonr","TMB"))

          # 2. graft the OSA headers onto the installed TMB
          TMB:::install.contrib(
            "https://github.com/vtrijoulet/OSA_multivariate_dists/archive/main.zip"
          )
          stopifnot(file.exists(system.file(
            "include/contrib/OSA_multivariate_dists-main/distr.hpp", package = "TMB"
          )))

          # 3. everything else, compResidual included
          renv::restore()
          renv::install("rcmdcheck")
          renv::install("quarto@1.5.1")
        shell: Rscript {0}

      - name: Install testthat
        run: renv::install(c("testthat"))
        shell: Rscript {0}

      - name: Install opal package
        run: renv::install(".")
        shell: Rscript {0}

      - name: Build site
        env:
          OPAL_DOCS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          mode <- if (Sys.getenv("OPAL_DOCS_BRANCH") %in% c("main", "master")) "release" else "devel"
          pkg <- pkgdown::as_pkgdown(".", override = list(development = list(mode = mode)))
          cat(paste0("OPAL_DOCS_PATH=", pkg$dst_path, "\n"), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          pkgdown::check_pkgdown(pkg)
          pkgdown::build_site_github_pages(pkg, new_process = FALSE, install = FALSE, quiet = FALSE)
        shell: Rscript {0}

      - name: Check internal site links
        run: python3 dev/check-site-links.py "$OPAL_DOCS_PATH"

      - name: Retain rendered documentation
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'dev')
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
