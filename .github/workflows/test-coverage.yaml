# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, dev]
  pull_request:

name: test-coverage.yaml

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv
      RENV_CONFIG_CACHE_SYMLINKS: FALSE

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/renv
          key: renv-v2-ubuntu-22.04-4.5.2-${{ hashFiles('renv.lock') }}
          restore-keys: renv-v2-ubuntu-22.04-4.5.2-

      - name: Restore renv environment
        run: |
          install.packages("renv", repos = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))
          renv::restore(packages = c(
            "Rcpp", "Matrix", "RcppEigen", "cpp11",
            "BH", "RcppParallel", "rapidjsonr", "TMB"
          ))
          TMB:::install.contrib(
            "https://github.com/vtrijoulet/OSA_multivariate_dists/archive/main.zip"
          )
          stopifnot(file.exists(system.file(
            "include/contrib/OSA_multivariate_dists-main/distr.hpp",
            package = "TMB"
          )))
          renv::restore()
          renv::install(c("covr", "xml2"))
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          # Authenticate protected-branch uploads without a long-lived secret.
          # Fork PRs retain Codecov's public-repository tokenless upload path.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
