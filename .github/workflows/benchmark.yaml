name: benchmarks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Generate replacement baselines for review (never commits them)"
        type: boolean
        default: false
      tolerance:
        description: "Regression tolerance as a fraction"
        type: string
        default: "0.10"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: benchmarks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPAL_BENCHMARK: "true"
  OPAL_BENCHMARK_ROOT: ${{ github.workspace }}
  OPAL_BENCHMARK_OUT: ${{ github.workspace }}/benchmark-out
  OPAL_BENCHMARK_UPDATE: ${{ inputs.update_baseline && 'true' || 'false' }}
  OPAL_BENCHMARK_FULL_FITS: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
  OPAL_BENCHMARK_TOL: ${{ inputs.tolerance || '0.10' }}

jobs:
  memory:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      OPAL_BENCHMARK_LAYER: memory
      OPAL_BENCHMARK_LIBRARY: ${{ github.workspace }}/../opal-head-lib
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-opal-env
      - name: Install HEAD package
        run: |
          mkdir -p "$OPAL_BENCHMARK_LIBRARY" "$OPAL_BENCHMARK_OUT"
          R CMD INSTALL --library="$OPAL_BENCHMARK_LIBRARY" .
      - name: Measure memory
        shell: Rscript {0}
        run: testthat::test_local(filter = "benchmark-models", stop_on_failure = TRUE)
      - name: Publish summary
        if: always()
        run: |
          if [ -f "$OPAL_BENCHMARK_OUT/summary.md" ]; then
            cat "$OPAL_BENCHMARK_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Memory benchmark did not produce a summary; inspect the job log and artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-memory
          path: benchmark-out/
          if-no-files-found: warn

  timing-ab:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      OPAL_BENCHMARK_LAYER: timing-ab
      OPAL_BENCHMARK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OPAL_BENCHMARK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      OPAL_BENCHMARK_BASE_LIBRARY: ${{ github.workspace }}/../opal-base-lib
      OPAL_BENCHMARK_HEAD_LIBRARY: ${{ github.workspace }}/../opal-head-lib
    steps:
      # This guard runs before any PR code. API failures deny the override.
      - name: Verify maintainer performance acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'OPAL_BENCHMARK_ACCEPTED=false' >> "$GITHUB_ENV"
          api() {
            curl --fail --silent --show-error --retry 3 \
              -H "authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }
          if ! pr=$(api "$API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER"); then
            echo 'Acceptance verification unavailable; regression gate remains enabled.'
            exit 0
          fi
          if ! jq -e '
            any(.labels[]; .name == "performance-accepted") and
            ((.body // "") | test("(?im)^Performance rationale:[ \\t]*\\S[^\\r\\n]*"))
          ' <<< "$pr" > /dev/null; then
            exit 0
          fi
          actor=''
          for page in $(seq 1 100); do
            if ! events=$(api "$API_URL/repos/$REPOSITORY/issues/$PR_NUMBER/events?per_page=100&page=$page"); then
              exit 0
            fi
            latest=$(jq -r '[.[] | select(.event == "labeled" and .label.name == "performance-accepted")] | last | .actor.login // empty' <<< "$events")
            if [ -n "$latest" ]; then actor=$latest; fi
            if [ "$(jq 'length' <<< "$events")" -lt 100 ]; then break; fi
            if [ "$page" -eq 100 ]; then exit 0; fi
          done
          if [ -z "$actor" ]; then exit 0; fi
          if ! permission=$(api "$API_URL/repos/$REPOSITORY/collaborators/$actor/permission"); then
            exit 0
          fi
          if jq -e '.permission == "admin" or .permission == "maintain" or .role_name == "maintain"' <<< "$permission" > /dev/null; then
            echo 'OPAL_BENCHMARK_ACCEPTED=true' >> "$GITHUB_ENV"
            echo 'Timing regression accepted by a verified repository maintainer; measurements remain in artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: ./.github/actions/setup-opal-env
      - name: Install BASE and HEAD packages separately
        run: |
          mkdir -p "$OPAL_BENCHMARK_BASE_LIBRARY" "$OPAL_BENCHMARK_HEAD_LIBRARY" "$OPAL_BENCHMARK_OUT"
          R CMD INSTALL --library="$OPAL_BENCHMARK_BASE_LIBRARY" base/
          R CMD INSTALL --library="$OPAL_BENCHMARK_HEAD_LIBRARY" .
      - name: Measure interleaved BASE and HEAD timing
        run: Rscript dev/run-benchmark-ab.R
      - name: Publish summary
        if: always()
        run: |
          if [ -f "$OPAL_BENCHMARK_OUT/summary.md" ]; then
            cat "$OPAL_BENCHMARK_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Timing benchmark did not produce a summary; inspect the job log and artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-timing-ab
          path: benchmark-out/
          if-no-files-found: warn

  instructions:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      OPAL_BENCHMARK_LAYER: instructions
      OPAL_BENCHMARK_LIBRARY: ${{ github.workspace }}/../opal-head-lib
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-opal-env
      - name: Install Valgrind
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends valgrind
      - name: Install HEAD package
        run: |
          mkdir -p "$OPAL_BENCHMARK_LIBRARY" "$OPAL_BENCHMARK_OUT"
          R CMD INSTALL --library="$OPAL_BENCHMARK_LIBRARY" .
      - name: Measure instructions
        run: Rscript dev/run-benchmark-instructions.R
      - name: Publish summary
        if: always()
        run: |
          if [ -f "$OPAL_BENCHMARK_OUT/summary.md" ]; then
            cat "$OPAL_BENCHMARK_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Instruction benchmark did not produce a summary; inspect the job log and artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-instructions
          path: benchmark-out/
          if-no-files-found: warn
