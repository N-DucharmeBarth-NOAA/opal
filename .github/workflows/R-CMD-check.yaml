# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
  # GitHub Actions cron uses UTC: 11 PM Sunday Auckland time during NZST.
  # This runs at 12 AM Monday during daylight saving time (NZDT).
  schedule:
    - cron: '0 11 * * 0'

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # - {os: windows-latest, r: 'release'}
          # - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-22.04,   r: '4.5.2'}
          - {os: ubuntu-22.04,   r: 'release'}
          # - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv
      RENV_CONFIG_CACHE_SYMLINKS: FALSE
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/renv
          key: renv-v2-${{ matrix.config.os }}-${{ matrix.config.r }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-v2-${{ matrix.config.os }}-${{ matrix.config.r }}-

      - name: Restore renv environment
        run: |
          install.packages("renv", repos = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))

          # 1. TMB first, in its own transaction so it lands in the real library
          renv::restore(packages = c("Rcpp", "Matrix", "RcppEigen", "cpp11",
                           "BH", "RcppParallel", "rapidjsonr","TMB"))

          # 2. graft the OSA headers onto the installed TMB
          TMB:::install.contrib(
            "https://github.com/vtrijoulet/OSA_multivariate_dists/archive/main.zip"
          )
          stopifnot(file.exists(system.file(
            "include/contrib/OSA_multivariate_dists-main/distr.hpp", package = "TMB"
          )))

          # 3. everything else, compResidual included
          renv::restore()
          renv::install("rcmdcheck")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--ignore-vignettes")'
          error-on: '"error"'
