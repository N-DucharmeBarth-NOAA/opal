# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
  # GitHub Actions cron uses UTC: 11 PM Sunday Auckland time during NZST.
  # This runs at 12 AM Monday during daylight saving time (NZDT).
  schedule:
    - cron: '0 11 * * 0'

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-22.04,   r: 'renv'}
          - {os: ubuntu-22.04,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      - uses: ./.github/actions/setup-opal-env
        with:
          r-version: ${{ matrix.config.r }}

      - name: Install rcmdcheck
        run: |
          if (!requireNamespace("rcmdcheck", quietly = TRUE)) {
            renv::restore(packages = "rcmdcheck", prompt = FALSE)
          }
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--ignore-vignettes")'
          error-on: '"error"'
