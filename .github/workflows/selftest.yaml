on:
  workflow_dispatch:
    inputs:
      nsim:
        description: "Number of simulations"
        default: "100"
      start:
        description: "truth or default"
        default: "default"
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 11 * * 0"

name: selftest.yaml

permissions: read-all

jobs:
  selftest:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv
      RENV_CONFIG_CACHE_SYMLINKS: FALSE
      OPAL_SELFTEST: "true"
      OPAL_SELFTEST_NSIM: ${{ github.event.inputs.nsim || (github.event_name == 'schedule' && '100') || '30' }}
      OPAL_SELFTEST_START: ${{ github.event.inputs.start || (github.event_name == 'schedule' && 'default') || 'truth' }}
      OPAL_SELFTEST_OUT: ${{ github.workspace }}/selftest-out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/renv
          key: renv-v2-ubuntu-22.04-4.5.2-${{ hashFiles('renv.lock') }}
          restore-keys: renv-v2-ubuntu-22.04-4.5.2-

      - name: Restore renv environment
        run: |
          install.packages("renv", repos = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))
          renv::restore(packages = c("Rcpp", "Matrix", "RcppEigen", "cpp11",
                           "BH", "RcppParallel", "rapidjsonr", "TMB"))
          TMB:::install.contrib(
            "https://github.com/vtrijoulet/OSA_multivariate_dists/archive/main.zip"
          )
          stopifnot(file.exists(system.file(
            "include/contrib/OSA_multivariate_dists-main/distr.hpp", package = "TMB"
          )))
          renv::restore()
        shell: Rscript {0}

      - name: Run self-tests
        run: |
          dir.create(Sys.getenv("OPAL_SELFTEST_OUT"), showWarnings = FALSE, recursive = TRUE)
          testthat::test_local(filter = "selftest", stop_on_failure = TRUE)
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-results
          path: selftest-out