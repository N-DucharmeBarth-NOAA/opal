on:
  push:
    paths: 
      - '**.Rmd'
      - '**.qmd' # Added to capture your Quarto vignettes

name: render-documents

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # ADDED: This installs the Quarto CLI required by your vignette engine
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-0 libsecret-1-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev

      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Install opal package
        run: renv::install(".")
        shell: Rscript {0}

      - name: Render Documents and Commit Results
        run: |
          # Identify changed Rmd and qmd files
          FILES=($(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '[.](Rmd|qmd)$'))
          
          # Render using the appropriate engine
          Rscript -e 'for (f in commandArgs(TRUE)) {
            if (!file.exists(f)) next
            if (grepl("\\.qmd$", f)) {
              quarto::quarto_render(f)
            } else {
              rmarkdown::render(f)
            }
          }' ${FILES[*]}
          
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          # Commit the resulting md or html files
          git add .
          git commit -m 'Re-build changed documents' || echo "No changes to commit"
          git push origin || echo "No changes to commit"