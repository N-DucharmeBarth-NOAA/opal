on:
  push:
    paths: 
      - '**.Rmd'
      - '**.qmd' # Added to capture your Quarto vignettes
      - '.github/workflows/render-rmarkdown.yaml'

name: render-documents

jobs:
  render:
    runs-on: ubuntu-22.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv
      RENV_CONFIG_CACHE_SYMLINKS: FALSE
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      
      - uses: r-lib/actions/setup-pandoc@v2

      # ADDED: This installs the Quarto CLI required by your vignette engine
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-0 libsecret-1-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/renv
          key: renv-v2-ubuntu-22.04-4.5.2-${{ hashFiles('renv.lock') }}
          restore-keys: renv-v2-ubuntu-22.04-4.5.2-

      - name: Restore renv environment
        run: |
          install.packages("renv", repos = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))

          # 1. TMB first, in its own transaction so it lands in the real library
          renv::restore(packages = c("Rcpp", "Matrix", "RcppEigen", "cpp11",
                           "BH", "RcppParallel", "rapidjsonr","TMB"))

          # 2. graft the OSA headers onto the installed TMB
          TMB:::install.contrib(
            "https://github.com/vtrijoulet/OSA_multivariate_dists/archive/main.zip"
          )
          stopifnot(file.exists(system.file(
            "include/contrib/OSA_multivariate_dists-main/distr.hpp", package = "TMB"
          )))

          # 3. everything else, compResidual included
          renv::restore()
          renv::install("quarto@1.5.1")
        shell: Rscript {0}

      - name: Install opal package
        run: renv::install(".")
        shell: Rscript {0}

      - name: Render Documents and Commit Results
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Identify changed Rmd and qmd files
          # New branches have no previous commit; compare their changes to dev.
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA=$(git merge-base origin/dev "$GITHUB_SHA")
          fi
          git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" -- '*.Rmd' '*.qmd' > "$RUNNER_TEMP/opal-changed-documents"
          FILES=()
          while IFS= read -r -d '' file; do
            FILES+=("$file")
          done < "$RUNNER_TEMP/opal-changed-documents"
          
          # Render using the appropriate engine
          Rscript -e 'for (f in commandArgs(TRUE)) {
            if (!file.exists(f)) next
            if (grepl("\\.qmd$", f)) {
              quarto::quarto_render(f)
            } else {
              rmarkdown::render(f)
            }
          }' "${FILES[@]}"
          
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          # Commit the resulting md or html files
          git add .
          git commit -m 'Re-build changed documents' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
