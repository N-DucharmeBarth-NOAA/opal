on:
  push:
    paths: 
      - 'README.Rmd'
      - 'vignettes/**.qmd'
      - '.github/workflows/render-rmarkdown.yaml'

name: render-documents

jobs:
  render:
    runs-on: ubuntu-22.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-opal-env

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-0 libsecret-1-dev \
            libx11-dev

      - name: Install Quarto R package
        run: |
          lock <- renv::lockfile_read("renv.lock")
          if (!is.null(lock$Packages$quarto)) {
            renv::restore(packages = "quarto")
          } else {
            # The quarto R package is not locked; retain the existing tool version.
            renv::install("quarto@1.5.1")
          }
        shell: Rscript {0}

      - name: Install opal package
        run: renv::install(".")
        shell: Rscript {0}

      - name: Render Documents and Commit Results
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Render package documentation only. Development assessments can
          # run substantial fits and must be invoked deliberately.
          # Identify changed Rmd and qmd files
          # New branches have no previous commit, and a force-push's previous
          # commit may no longer exist; compare their changes to dev.
          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            BEFORE_SHA=$(git merge-base origin/dev "$GITHUB_SHA")
          fi
          git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" -- 'README.Rmd' 'vignettes/*.qmd' > "$RUNNER_TEMP/opal-changed-documents"
          FILES=()
          while IFS= read -r -d '' file; do
            FILES+=("$file")
          done < "$RUNNER_TEMP/opal-changed-documents"
          
          # Render using the appropriate engine
          Rscript -e 'for (f in commandArgs(TRUE)) {
            if (!file.exists(f)) next
            if (grepl("\\.qmd$", f)) {
              quarto::quarto_render(f)
            } else {
              rmarkdown::render(f)
            }
          }' "${FILES[@]}"
          
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          # Commit the resulting md or html files
          git add .
          git commit -m 'Re-build changed documents' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
